name: accidentes-las-condes-confluencia

x-entorno: &entorno
  image: las-condes-siniestros:revision
  working_dir: /workspace
  network_mode: none
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:mode=1777"]

services:
  desarrollo:
    <<: *entorno
    user: "${ANALISIS_UID:-1000}:${ANALISIS_GID:-1000}"
    volumes:
      - ./desarrollo:/workspace/desarrollo:rw
      - ./docs:/workspace/docs:ro
    command: ["sleep", "infinity"]

  experimentacion:
    <<: *entorno
    build:
      context: .
      dockerfile: Dockerfile
    user: "${ANALISIS_UID:-1000}:${ANALISIS_GID:-1000}"
    volumes:
      - ./datos:/workspace/datos:ro
      - ./desarrollo:/workspace/desarrollo:ro
      - ./experimentos/resultados:/workspace/experimentos/resultados:rw
      - ./experimentos/privado:/workspace/experimentos/privado:rw
    command: ["python", "desarrollo/run_all.py"]

  auditoria:
    <<: *entorno
    user: "65534:65534"
    volumes:
      - ./desarrollo:/workspace/desarrollo:ro
      - ./experimentos/resultados:/workspace/experimentos/resultados:ro
    command: ["python", "desarrollo/run_all.py", "--verificar"]
